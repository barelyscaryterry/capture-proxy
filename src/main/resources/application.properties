capture-proxy.netty.port=8443
capture-proxy.ddb.table=capture-proxy-requests
capture-proxy.forward.host=localhost
capture-proxy.forward.port=8080
capture-proxy.forward.connect-timeout-ms=2000
capture-proxy.forward.read-timeout-ms=10000
# Only these path prefixes (exact match or prefix + "/") are forwarded upstream; everything else gets a local 404.
capture-proxy.forward.allowed-path-prefixes=/api/beers

# Capture sink: "log" (rolling JSON-lines file, shipped to CloudWatch Logs by the agent) or "ddb".
capture-proxy.capture.sink=log
capture-proxy.capture.log-dir=/var/log/capture-proxy
capture-proxy.capture.max-body-bytes=8192

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# CloudWatch metrics export - namespace/step match the dashboard in infra/terraform/cloudwatch.tf
management.cloudwatch.metrics.export.namespace=capture-proxy
management.cloudwatch.metrics.export.step=1m
management.cloudwatch.metrics.export.batch-size=20
